<style>
  :root { --gold:#c9a84c;--gold-light:#e8c97a;--bg:#080808;--bg2:#0f0f0f;--bg3:#151515;--border:rgba(201,168,76,0.15);--text:#f0ece0;--text-muted:#6b6556; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 60px;background:rgba(8,8,8,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
  .logo{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--gold-light);text-decoration:none}
  .logo span{color:var(--text-muted)}
  .nav-links{display:flex;gap:32px;align-items:center}
  .nav-links a{color:#888;text-decoration:none;font-size:13px;letter-spacing:.5px;font-weight:500}
  .nav-links a:hover{color:var(--gold-light)}
  .nav-mobile-btn{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer}

  .article-wrap{max-width:760px;margin:0 auto;padding:130px 24px 80px}
  .back-link{display:inline-block;font-size:13px;color:var(--gold);text-decoration:none;margin-bottom:24px}
  .article-cat{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
  .article-h1{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,44px);font-weight:400;line-height:1.15;margin-bottom:18px}
  .article-meta{font-size:13px;color:#666;margin-bottom:32px;display:flex;gap:16px;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--border)}
  .article-img-main{width:100%;border-radius:12px;margin-bottom:32px;border:1px solid var(--border)}
  .article-content{font-size:16px;color:#c8c3b8;line-height:1.9}
  .article-content h2{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold-light);margin:32px 0 14px;font-weight:500}
  .article-content h3{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--text);margin:24px 0 10px;font-weight:500}
  .article-content p{margin-bottom:18px}
  .article-content strong{color:var(--text)}
  .article-content ul,.article-content ol{margin:0 0 18px 22px}
  .article-content li{margin-bottom:8px}
  .article-content a{color:var(--gold-light)}
  .article-content img{max-width:100%;border-radius:8px;margin:20px 0}

  .cta-box{background:linear-gradient(135deg,#161206,#0f0f0f);border:1px solid rgba(201,168,76,0.3);border-radius:14px;padding:32px 28px;text-align:center;margin-top:48px}
  .cta-box h3{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;margin-bottom:10px}
  .cta-box p{color:#888;font-size:14px;margin-bottom:20px}
  .cta-btn{display:inline-block;background:var(--gold);color:var(--bg);text-decoration:none;padding:13px 32px;border-radius:6px;font-weight:700;font-size:14px}

  .not-found{text-align:center;padding:160px 20px 80px;color:#666}
  .not-found a{color:var(--gold);text-decoration:none}

  footer{background:var(--bg);border-top:1px solid var(--border);padding:32px 60px;text-align:center;margin-top:40px}

  @media(max-width:600px){
    nav{padding:14px 16px}
    .nav-links{display:none}
    .nav-mobile-btn{display:block}
    .article-wrap{padding:100px 16px 60px}
    footer{padding:24px 16px}
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Formation<span>Elite</span></a>
  <div class="nav-links">
    <a href="index.html">Accueil</a>
    <a href="formations.html">Formations</a>
    <a href="elite-pass.html">L'Élite Pass</a>
    <a href="blog.html">Blog</a>
  </div>
  <button class="nav-mobile-btn" onclick="toggleMobileNav()">☰</button>
</nav>
<div id="mobileNav" style="display:none;position:fixed;top:61px;left:0;right:0;background:rgba(8,8,8,0.98);z-index:99;padding:16px 20px 24px;border-bottom:1px solid var(--border)">
  <a href="index.html" style="display:block;padding:14px 0;font-size:15px;color:#888;text-decoration:none;border-bottom:1px solid var(--border)">Accueil</a>
  <a href="formations.html" style="display:block;padding:14px 0;font-size:15px;color:#888;text-decoration:none;border-bottom:1px solid var(--border)">Formations</a>
  <a href="blog.html" style="display:block;padding:14px 0;font-size:15px;color:#888;text-decoration:none">Blog</a>
</div>

<div id="articleContainer" class="article-wrap">
  <div style="text-align:center;color:#555;padding:60px 0">Chargement...</div>
</div>

<footer>
  <p style="font-size:12px;color:#555">© 2026 FormationElite.vip — Support : <a href="https://t.me/CreativeagencyFr" style="color:var(--gold);text-decoration:none">@CreativeagencyFr</a></p>
</footer>

<script>
const SUPABASE_URL = "https://xrljfmrsrxyepdsysfan.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhybGpmbXJzcnh5ZXBkc3lzZmFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NzY0NTcsImV4cCI6MjA5NTA1MjQ1N30.lmYKrJ_q4F_wWY0eKYR-vrQVgSrbXCNG7XhxPj7J_4E";

function getSlugFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const fromParam = params.get('slug');
  if (fromParam) return fromParam;
  const match = window.location.pathname.match(/\/blog\/([^\/]+)/);
  return match ? match[1] : null;
}

async function loadArticle() {
  const slug = getSlugFromUrl();
  const container = document.getElementById('articleContainer');
  if (!slug) {
    container.innerHTML = `<div class="not-found"><h2 style="font-family:'Cormorant Garamond',serif;font-weight:300;margin-bottom:12px">Article introuvable</h2><a href="/blog.html">← Retour au blog</a></div>`;
    return;
  }
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/articles?slug=eq.${encodeURIComponent(slug)}&actif=eq.true&select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    const a = Array.isArray(data) ? data[0] : null;
    if (!a) {
      container.innerHTML = `<div class="not-found"><h2 style="font-family:'Cormorant Garamond',serif;font-weight:300;margin-bottom:12px">Article introuvable</h2><a href="/blog.html">← Retour au blog</a></div>`;
      return;
    }

    const date = new Date(a.created_at).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
    document.title = `${a.titre} — FormationElite.vip`;
    document.getElementById('pageTitle').textContent = `${a.titre} — FormationElite.vip`;
    document.getElementById('pageDesc').setAttribute('content', a.extrait || '');
    document.getElementById('pageCanonical').setAttribute('href', `https://www.formationelite.vip/blog/${a.slug}`);

    container.innerHTML = `
      <a href="/blog.html" class="back-link">← Retour au blog</a>
      <div class="article-cat">${a.categorie || 'Guide'}</div>
      <h1 class="article-h1">${a.titre}</h1>
      <div class="article-meta"><span>${date}</span><span>·</span><span>${a.auteur || 'FormationElite'}</span></div>
      ${a.image ? `<img src="${a.image}" class="article-img-main" alt="${a.titre}">` : ''}
      <div class="article-content">${a.contenu}</div>
      <div class="cta-box">
        <h3>Prêt à passer à l'action ?</h3>
        <p>Découvrez nos formations premium pour aller plus loin, plus vite.</p>
        <a href="/formations.html" class="cta-btn">Voir les formations →</a>
      </div>
    `;

    const schema = {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": a.titre,
      "description": a.extrait || '',
      "image": a.image || "https://www.formationelite.vip/logo.jpg",
      "datePublished": a.created_at,
      "author": { "@type": "Organization", "name": a.auteur || "FormationElite" },
      "publisher": { "@type": "Organization", "name": "FormationElite", "logo": { "@type": "ImageObject", "url": "https://www.formationelite.vip/logo.jpg" } }
    };
    const script = document.createElement('script');
    script.type = 'application/ld+json';
    script.textContent = JSON.stringify(schema);
    document.head.appendChild(script);

  } catch (e) {
    container.innerHTML = `<div class="not-found"><h2 style="font-family:'Cormorant Garamond',serif;font-weight:300;margin-bottom:12px">Erreur de chargement</h2><a href="/blog.html">← Retour au blog</a></div>`;
  }
}
function toggleMobileNav() {
  const nav = document.getElementById('mobileNav');
  nav.style.display = nav.style.display === 'none' ? 'block' : 'none';
}
loadArticle();
</script>
</body>
</html>
